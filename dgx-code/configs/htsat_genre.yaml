# HTS-AT: Hierarchical Token-Semantic Audio Transformer (from scratch on FMA)
# Swin-Transformer architecture adapted for audio spectrograms.
# Trained from scratch — ensemble diversity with the pretrained models.
run_name: htsat_genre
model: htsat
num_classes: 8

target_sr: 32000
max_duration_sec: 10.0
n_mels: 128
embed_dim: 96
depths: [2, 2, 6, 2]
num_heads: [3, 6, 12, 24]

dataset_type: episode
episode_sec: 10.0
batch_size: 32
num_workers: 4

epochs: 60
lr: 0.0003
weight_decay: 0.01
scheduler: cosine_warmup
warmup_steps: 500
grad_accum_steps: 2
max_grad_norm: 1.0

dropout: 0.1
label_smoothing: 0.1
mixup_alpha: 0.3

seed: 42
early_stopping_patience: 15
use_amp: true
