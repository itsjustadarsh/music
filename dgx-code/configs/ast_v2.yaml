# AST v2 — targets AST v1's epoch-1 overfitting: random 10s crops (3 per track per
# epoch), SpecAugment, lower LR, fewer frozen layers, stronger mixup.
run_name: ast_v2
model: ast_finetune
num_classes: 8

target_sr: 16000
max_duration_sec: 10.0
freeze_layers: 4
spec_augment: true

dataset_type: random_crop
episode_sec: 10.0
crop_repeats: 3
batch_size: 32
num_workers: 4

epochs: 15
lr: 0.00002
weight_decay: 0.05
scheduler: cosine_warmup
warmup_steps: 300
grad_accum_steps: 1
max_grad_norm: 1.0

dropout: 0.3
label_smoothing: 0.1
mixup_alpha: 0.4

seed: 42
early_stopping_patience: 5
use_amp: true
