# MERT-v1-330M partial unfreeze — top 4 transformer layers unfrozen
# Higher capacity than LoRA, but more overfitting risk. Use with
# strong regularisation and lower learning rate.
run_name: mert_unfreeze_330m
model: mert_finetune
checkpoint: "m-a-p/MERT-v1-330M"
num_classes: 8

use_lora: false
unfreeze_layers: 4
pool_mode: weighted
gradient_checkpointing: true

dataset_type: episode
target_sr: 24000
episode_sec: 3.0
batch_size: 32
num_workers: 4

epochs: 20
lr: 0.00005
weight_decay: 0.05
layer_lr_decay: 0.75
scheduler: cosine_warmup
warmup_steps: 300
grad_accum_steps: 4
max_grad_norm: 1.0

dropout: 0.4
label_smoothing: 0.1
mixup_alpha: 0.4
classifier_hidden: 512

seed: 42
early_stopping_patience: 8
use_amp: true
