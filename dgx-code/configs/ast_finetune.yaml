# Audio Spectrogram Transformer — AudioSet-pretrained, different inductive bias from MERT
# Good ensemble complement: supervised discriminative features vs self-supervised music features
run_name: ast_finetune
model: ast_finetune
num_classes: 8

target_sr: 16000
max_duration_sec: 10.0
freeze_layers: 6

dataset_type: episode
episode_sec: 10.0
batch_size: 32
num_workers: 4

epochs: 30
lr: 0.0001
weight_decay: 0.01
scheduler: cosine_warmup
warmup_steps: 200
grad_accum_steps: 2
max_grad_norm: 1.0

dropout: 0.3
label_smoothing: 0.1
mixup_alpha: 0.2

seed: 42
early_stopping_patience: 10
use_amp: true
