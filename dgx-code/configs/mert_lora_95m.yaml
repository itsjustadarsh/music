# MERT-v1-95M with LoRA — smaller model, faster training, good for ensemble diversity
run_name: mert_lora_95m
model: mert_finetune
checkpoint: "m-a-p/MERT-v1-95M"
num_classes: 8

use_lora: true
lora_rank: 16
lora_alpha: 32
unfreeze_layers: 0
pool_mode: weighted
gradient_checkpointing: true

dataset_type: episode
target_sr: 24000
episode_sec: 3.0
batch_size: 128
num_workers: 4

epochs: 30
lr: 0.0003
weight_decay: 0.01
scheduler: cosine_warmup
warmup_steps: 200
grad_accum_steps: 1
max_grad_norm: 1.0

dropout: 0.3
label_smoothing: 0.1
mixup_alpha: 0.3
classifier_hidden: 512

seed: 42
early_stopping_patience: 10
use_amp: true
